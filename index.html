<!doctype html>
<html lang="pt-BR" style="background-color: #1A110B;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>NOSTA. — Timeless Analog Camera</title>
    <meta name="description" content="NOSTA. - A essência da fotografia analógica com design atemporal, ótica precisa e construção artesanal." />

    <!-- Preload critical Hero / Intro assets & self-hosted WOFF2 variable fonts (latin) -->
    <link rel="preload" as="image" href="/hero7/smoke-poster.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero7/preloader-bg.svg" fetchpriority="high" />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>

    <!-- Self-hosted @font-face (font-display: swap) + Critical Above-the-Fold CSS -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 500 900;
        font-display: swap;
        src: url('/fonts/outfit-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 600 800;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        background-color: #1A110B;
        color: #4A3020;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        background-color: #F2E4CC;
        min-height: 100vh;
      }
      #boot-curtain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100svh;
        background-color: #1A110B;
        z-index: 99998;
        pointer-events: none;
      }
      .nosta-hero-section {
        position: relative;
        width: 100%;
        min-height: 100svh;
        height: 100svh;
        overflow: hidden;
        background-color: #F2E4CC;
      }
      .hero7-preloader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100svh;
        z-index: 100000;
        overflow: hidden;
      }
      .hero7-solid-curtain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100svh;
        background-color: #1A110B;
        z-index: 1;
      }
      .nosta-hero-title {
        font-family: 'Outfit', 'Inter', sans-serif;
        font-weight: 900;
        color: #432817;
      }
    </style>
  </head>
  <body style="background-color: #1A110B;">
    <div id="boot-curtain" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
